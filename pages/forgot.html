<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ko-Ajuda | Recuperar Senha</title>
    <link rel="shortcut icon" href="../favicon.svg" type="image/x-icon" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/forgot.css" />
  </head>
  <body class="forgot-body">
    <main class="forgot-container">
      <div class="forgot-card">
        <a
          href="./login.html"
          class="back-link"
          aria-label="Voltar para a página de login"
        >
          <i class="ph ph-arrow-left"></i>
          <span>Voltar ao login</span>
        </a>
        <div class="forgot-header">
          <img
            src="../assets/brand/Logo.svg"
            alt="Ko-Ajuda Logo"
            class="logo"
          />
          <h1>Esqueceu a senha?</h1>
        </div>
        <p class="forgot-description">
          Não se preocupe! Digite seu e-mail cadastrado e enviaremos as
          instruções para você redefinir sua senha com segurança.
        </p>
        <form class="forgot-form">
          <div class="input-group">
            <label for="email">E-mail cadastrado</label>
            <input
              type="email"
              id="email"
              placeholder="exemplo@gmail.com"
              required
            />
          </div>
          <button type="submit" class="btn-submit">Enviar instruções</button>
        </form>

        <div class="support-footer">
          <p>
            Precisa de ajuda adicional?
            <a href="./contato.html">Fale com o suporte</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
